<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Ultra Profile UI</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui;
}

body{
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#05070a;
}

/* ===== BACKGROUND ANIMATION ===== */
.bg{
  position:absolute;
  width:200%;
  height:200%;
  background: radial-gradient(circle at 20% 30%, #00ff9960, transparent 40%),
              radial-gradient(circle at 80% 70%, #00ff9950, transparent 45%);
  animation: floatBG 10s ease-in-out infinite alternate;
  filter: blur(40px);
}

@keyframes floatBG{
  0%{transform:translate(-10%,-10%) scale(1);}
  100%{transform:translate(10%,10%) scale(1.1);}
}

/* ===== CARD ===== */
.card{
  width:460px;
  height:780px;
  border-radius:30px;
  position:relative;
  overflow:hidden;
  background:#0b0f14;
  box-shadow:0 20px 80px rgba(0,0,0,0.7);
}

/* neon border layer */
.card::before{
  content:"";
  position:absolute;
  inset:-2px;
  background:conic-gradient(from 180deg,#00ff99,#00ccff,#00ff99);
  animation:spin 6s linear infinite;
}

/* inner panel */
.card::after{
  content:"";
  position:absolute;
  inset:2px;
  background:linear-gradient(180deg,#0b0f14,#070a0f);
  border-radius:28px;
}

.content{
  position:relative;
  z-index:2;
  padding:30px;
  color:white;
}

/* ===== HEADER ===== */
.header{
  text-align:center;
}

.avatar{
  width:130px;
  height:130px;
  border-radius:50%;
  margin:auto;
  background:url("avatar.jpg") center/cover;
  border:2px solid rgba(0,255,153,0.4);
  box-shadow:
    0 0 20px #00ff99,
    0 0 60px #00ff9950;
  transition:0.3s;
}

.avatar:hover{
  transform:scale(1.05);
  box-shadow:0 0 30px #00ff99,0 0 80px #00ff99aa;
}

.name{
  margin-top:15px;
  font-size:24px;
  font-weight:700;
}

.role{
  color:#00ff99;
  font-size:14px;
  margin-top:5px;
}

.bio{
  margin-top:10px;
  font-size:13px;
  opacity:0.7;
}

/* ===== GLASS BOX ===== */
.box{
  margin-top:18px;
  padding:16px;
  border-radius:18px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(0,255,153,0.2);
  backdrop-filter: blur(12px);
  transition:0.25s;
}

.box:hover{
  transform:translateY(-3px);
  border-color:#00ff99;
  box-shadow:0 10px 30px rgba(0,255,153,0.1);
}

/* ===== SKILLS ===== */
.skills span{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin:5px;
  padding:7px 12px;
  border-radius:12px;
  border:1px solid #00ff99;
  font-size:13px;
  transition:0.2s;
}

.skills span:hover{
  background:#00ff99;
  color:#000;
  transform:scale(1.05);
}

/* ===== ĐẾM NGƯỢC NGHỈ HÈ😋 ===== */
.time{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

.time div{
  width:23%;
  background:#000;
  padding:10px;
  border-radius:12px;
  border:1px solid rgba(0,255,153,0.15);
  transition:0.2s;
}

.time div:hover{
  transform:translateY(-3px);
  border-color:#00ff99;
}

/* ===== INFO ===== */
.info p{
  margin:8px 0;
  font-size:13px;
  opacity:0.85;
}

.info i{
  color:#00ff99;
  margin-right:6px;
}

/* spin border */
@keyframes spin{
  100%{transform:rotate(360deg);}
}
</style>

</head>

<body>

<img src="avatar.jpg" width="100">

<div class="bg"></div>

<div class="card">
<div class="content">

  <!-- HEADER -->

  <div class="header">
    <div class="avatar"></div>
    <div class="name">It'sNhaat</div>
    <div class="role"><i class="fa-solid fa-code"></i> Developer Mode</div>
    <div class="bio">Dev người miền tây, viết code bằng hoa cải.
                    Yêu em còn thơ ngây, vì đời còn chưa trải.🗿</div>
  </div>

  <!-- SKILLS -->

  <div class="box skills">
    <b>Skills</b><br>
    <span><i class="fa-brands fa-python"></i> Python</span>
    <span><i class="fa-solid fa-code"></i> C++</span>
  </div>

  <!-- ĐẾM NGƯỢC NGHỈ HÈ😋 -->

  <div class="box">
    <b><i class="fa-solid fa-clock"></i> ĐẾM NGƯỢC NGHỈ HÈ😋</b>
    <div class="time">
      <div><b id="d">0</b><br>Day</div>
      <div><b id="h">0</b><br>Hour</div>
      <div><b id="m">0</b><br>Min</div>
      <div><b id="s">0</b><br>Sec</div>
    </div>
  </div>

  <!-- INFO -->

  <div class="box info">
    <b>Info</b>
    <p><i class="fa-brands fa-discord"></i> discord.gg/abcxyz</p>
    <p><i class="fa-solid fa-cake-candles"></i> 01/1/2012</p>
    <p><i class="fa-solid fa-school"></i> THCS Phan Chu Trinh</p>
  </div>

</div>
</div>

<script>
const target = new Date("June 1, 2026 00:00:00").getTime();

setInterval(()=>{
  const now = Date.now();
  const d = target - now;

  document.getElementById("d").innerText = Math.floor(d/86400000);
  document.getElementById("h").innerText = Math.floor(d/3600000)%24;
  document.getElementById("m").innerText = Math.floor(d/60000)%60;
  document.getElementById("s").innerText = Math.floor(d/1000)%60;
},1000);
</script>

</body>
</html>
