<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="card">

    <div class="avatar"></div>

    <h2>It'sTrueHieu</h2>

        <div><b>10</b><br>Phút</div>
        <div><b>20</b><br>Giây</div>
      </div>
    </div>

    <div class="info">
      <p>🎮 discord.gg/abcxyz</p>
      <p>🎂 01/11/2011 - 14 tuổi</p>
      <p>🏫 THCS Phúc Điền</p>
    </div>

  </div>
</div>

</body>
</html>
