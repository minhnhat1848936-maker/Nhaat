<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Profile Clone UI</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#05070a;
}

/* ===== CARD CHÍNH ===== */
.card{
  width:430px;
  height:760px;
  border-radius:28px;
  position:relative;
  overflow:hidden;
}

/* viền neon xoay */
.card::before{
  content:"";
  position:absolute;
  width:220%;
  height:220%;
  background:conic-gradient(#00ff99, transparent, #00ff99, transparent);
  animation:spin 5s linear infinite;
  top:-60%;
  left:-60%;
}

/* nền trong */
.card::after{
  content:"";
  position:absolute;
  inset:3px;
  background:linear-gradient(180deg,#0b0f14,#05070a);
  border-radius:28px;
}

/* content */
.content{
  position:relative;
  z-index:2;
  padding:30px;
  color:white;
}

/* ===== HEADER ===== */
.header{
  text-align:center;
  margin-top:10px;
}

.avatar{
  width:125px;
  height:125px;
  border-radius:50%;
  margin:auto;
  background:url("https://picsum.photos/300") center/cover;
  box-shadow:0 0 25px #00ff99;
  border:2px solid rgba(0,255,153,0.4);
}

.name{
  margin-top:15px;
  font-size:22px;
  font-weight:bold;
}

.role{
  margin-top:5px;
  color:#00ff99;
  font-size:14px;
}

.bio{
  margin-top:10px;
  font-size:13px;
  opacity:0.75;
}

/* ===== BOX STYLE ===== */
.box{
  margin-top:18px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(0,255,153,0.25);
  border-radius:16px;
  padding:15px;
  backdrop-filter: blur(10px);
}

/* ===== SKILL ===== */
.skills span{
  display:inline-block;
  margin:5px;
  padding:6px 12px;
  border-radius:10px;
  border:1px solid #00ff99;
  font-size:13px;
}

/* ===== COUNTDOWN ===== */
.time{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

.time div{
  width:23%;
  background:#000;
  padding:10px;
  border-radius:10px;
  text-align:center;
  border:1px solid rgba(0,255,153,0.2);
}

/* ===== INFO ===== */
.info p{
  margin:8px 0;
  font-size:13px;
}

.info i{
  color:#00ff99;
  margin-right:6px;
}

/* ANIMATION */
@keyframes spin{
  100%{transform:rotate(360deg);}
}
</style>

</head>

<body>

<div class="card">
  <div class="content">

<script>
const target = new Date("June 1, 2026 00:00:00").getTime();

setInterval(()=>{
  const now = Date.now();
  const diff = target - now;

  document.getElementById("d").innerText = Math.floor(diff/86400000);
  document.getElementById("h").innerText = Math.floor(diff/3600000)%24;
  document.getElementById("m").innerText = Math.floor(diff/60000)%60;
  document.getElementById("s").innerText = Math.floor(diff/1000)%60;
},1000);
</script>
