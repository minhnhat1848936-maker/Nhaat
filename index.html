<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Profile Full UI</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle at left, #022c22, #000);
  color:white;
}

/* CARD LỚN */
.card{
  width:420px;
  min-height:720px;
  padding:30px 25px;
  border-radius:25px;
  position:relative;
  overflow:hidden;
}

/* glow */
.card::before{
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  background:conic-gradient(#00ff99, transparent, #00ff99);
  animation:spin 5s linear infinite;
  top:-50%;
  left:-50%;
}

.card::after{
  content:"";
  position:absolute;
  inset:3px;
  background:#0b0f14;
  border-radius:25px;
}

.card *{
  position:relative;
  z-index:2;
}

/* HEADER */
.header{
  text-align:center;
  margin-bottom:20px;
}

.avatar{
  width:120px;
  height:120px;
  border-radius:50%;
  margin:auto;
  background:url("https://picsum.photos/300") center/cover;
  box-shadow:0 0 25px #00ff99;
}

h2{
  margin-top:15px;
  font-size:22px;
}

.role{
  color:#00ff99;
  font-size:14px;
  margin-top:5px;
}

.bio{
  margin-top:10px;
  opacity:0.85;
}

/* BOX CHUNG */
.box{
  background:#111;
  padding:15px;
  border-radius:15px;
  margin-top:15px;
  border:1px solid rgba(0,255,153,0.3);
}

/* SKILL */
.skills span{
  display:inline-block;
  padding:6px 12px;
  margin:5px;
  border:1px solid #00ff99;
  border-radius:10px;
  transition:0.3s;
}

.skills span:hover{
  background:#00ff99;
  color:black;
}

/* COUNTDOWN */
.time{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

.time div{
  background:#000;
  padding:12px;
  border-radius:10px;
  width:23%;
  text-align:center;
}

/* INFO */
.info p{
  margin:8px 0;
}

.info i{
  color:#00ff99;
  margin-right:6px;
}

/* animation */
@keyframes spin{
  100%{ transform:rotate(360deg); }
}
</style>

</head>

<body>

<div class="card">

  <!-- HEADER -->

  <div class="header">
    <div class="avatar"></div>
    <h2>It'sTrueHieu</h2>
    <p class="role"><i class="fa-solid fa-code"></i> He/Him - Simp Venti & CODE</p>
    <p class="bio">🍃 Gió thổi mây bay, thì tốt ngay thôi!</p>
  </div>

  <!-- SKILL -->

  <div class="box skills">
    <h4>Ngôn ngữ lập trình</h4>
    <span><i class="fa-brands fa-python"></i> Python</span>
    <span><i class="fa-solid fa-laptop-code"></i> C++</span>
  </div>

  <!-- COUNTDOWN -->

  <div class="box">
    <h4><i class="fa-solid fa-clock"></i> Kỳ thi vào 10</h4>
    <div class="time">
      <div><b id="d">0</b><br>Ngày</div>
      <div><b id="h">0</b><br>Giờ</div>
      <div><b id="m">0</b><br>Phút</div>
      <div><b id="s">0</b><br>Giây</div>
    </div>
  </div>

  <!-- INFO -->

  <div class="box info">
    <h4>Thông tin</h4>
    <p><i class="fa-brands fa-discord"></i> discord.gg/abcxyz</p>
    <p><i class="fa-solid fa-cake-candles"></i> 01/11/2011</p>
    <p><i class="fa-solid fa-school"></i> THCS Phúc Điền</p>
  </div>

</div>

<script>
const target = new Date("June 1, 2026 00:00:00").getTime();

setInterval(()=>{
  const now = new Date().getTime();
  const dis = target - now;

  document.getElementById("d").innerText = Math.floor(dis/(1000*60*60*24));
  document.getElementById("h").innerText = Math.floor((dis/(1000*60*60))%24);
  document.getElementById("m").innerText = Math.floor((dis/(1000*60))%60);
  document.getElementById("s").innerText = Math.floor((dis/1000)%60);
},1000);
</script>

</body>
</html>
