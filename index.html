<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile của Người dùng</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="profile-card">
            <img src="https://via.placeholder.com/100" alt="Avatar" class="avatar">
            <h1 class="name">It's TrueHieu</h1>
            <p class="tagline">🍃 Gió thổi mây bay, thi tốt ngay thôi!</p>
        </header>

        <div class="card">
            <h3>NGÔN NGỮ LẬP TRÌNH</h3>
            <div class="badges">
                <span class="badge python">PYTHON</span>
                <span class="badge cpp">C++</span>
            </div>
        </div>

        <div class="card countdown-card">
            <h3>KỲ THI VÀO 10 SẮP TỚI</h3>
            <div id="countdown">
                <div class="time-box"><span id="days">00</span><p>NGÀY</p></div>
                <div class="time-box"><span id="hours">00</span><p>GIỜ</p></div>
                <div class="time-box"><span id="minutes">00</span><p>PHÚT</p></div>
                <div class="time-box"><span id="seconds">00</span><p>GIÂY</p></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
